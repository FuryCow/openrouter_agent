name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-setuptools

      - name: Prepare native module build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify toolchain
        shell: bash
        run: |
          echo "Node $(node -v)"
          echo "npm $(npm -v)"
          echo "Python $(python --version)"

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --loglevel=error

      - name: Run tests
        run: npm test

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package -- --${{ matrix.platform }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          shopt -s nullglob
          for file in release/*.exe release/*.dmg release/*.AppImage; do
            cp "$file" dist-installers/
          done
          echo "Installers:"
          ls -lh dist-installers/
          if [ -z "$(ls -A dist-installers)" ]; then
            echo "::error::No installer found in release/"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist-installers/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List installers
        run: find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -ls

      - name: Delete previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
